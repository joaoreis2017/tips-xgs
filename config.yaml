# tipsxgs configuration.
#
# IMPORTANT: the `selector` / `json_path` values below are PLACEHOLDERS.
# This project's dev sandbox has no network access to xgscore.io or
# betclic.pt, so none of these could be verified against the live sites.
# Run `python scripts/inspect_site.py <url>` from a machine that *can*
# reach them, then fill in the real values here -- see docs/CALIBRATION.md
# for the step by step. Nothing else in the code needs to change.

timezone: "Europe/Lisbon"
data_dir: "data"        # where daily games.json snapshots are written
reports_dir: "data"     # where the daily index.html dashboard is written
value_bet_threshold: 1.0     # value_ratio above this counts as a "value bet"
min_match_confidence: 80     # fuzzy-match score (0-100) required to pair a fixture with a Betclic offer
max_concurrent_previews: 3
headless: true

xgscore:
  base_url: "https://xgscore.io"

  fixtures:
    # TODO(calibrate): confirm this is really where "today's games" live.
    # xgscore.io's homepage may show today's fixtures directly, or there
    # may be a dedicated /fixtures or /today page -- check with
    # scripts/inspect_site.py.
    url: "https://xgscore.io/"

    # If the fixtures are embedded as JSON (e.g. a Next.js __NEXT_DATA__
    # blob), set this to a JMESPath expression that resolves to the list
    # of fixture objects, and give each field below a `json_path`
    # (evaluated relative to *one* fixture item). Leave both this and
    # `fields[].json_path` unset to fall back to CSS selectors instead.
    json_list_path: null   # e.g. "props.pageProps.fixtures"

    # One CSS selector matching each fixture row/card on the page (used
    # only if json_list_path above is not set / yields nothing).
    list_item_selector: null   # e.g. "div.fixture-row"

    fields:
      # Each field is either CSS-based (selector [+ attr] [+ regex]) or
      # JSON-based (json_path). `preview_url` may be omitted entirely --
      # if missing, it's built automatically as
      # {base_url}/{league}/{home-slug}-{away-slug}/preview
      - key: league
        selector: null        # e.g. ".fixture-row .league-name"
      - key: home_team
        selector: null        # e.g. ".fixture-row .team-home"
      - key: away_team
        selector: null        # e.g. ".fixture-row .team-away"
      - key: kickoff
        selector: null        # e.g. ".fixture-row time" (attr: datetime)
        attr: null
      - key: preview_url
        selector: null        # e.g. ".fixture-row a" (attr: href)
        attr: href

  preview:
    # No `url` here -- the preview page URL comes from each Fixture
    # (either scraped above, or built from base_url/league/home-away).
    json_list_path: null   # preview pages have one game, not a list

    fields:
      # Populate with whatever markets xGScore's preview page actually
      # shows (goal probabilities, 1X2, BTTS, over/under, correct score,
      # etc.) -- add as many rows as there are numbers you want to
      # capture. `key` is an arbitrary raw name; map it to a canonical
      # market/outcome in market_aliases below.
      - key: prob_home_win
        selector: null   # e.g. "[data-market='1x2'] .outcome-home .prob"
      - key: prob_draw
        selector: null
      - key: prob_away_win
        selector: null
      - key: prob_btts_yes
        selector: null
      - key: prob_btts_no
        selector: null
      - key: prob_over_2_5
        selector: null
      - key: prob_under_2_5
        selector: null

    # Maps each raw `key` above to "<canonical_market>.<outcome>" (see
    # src/tipsxgs/markets.py for the full vocabulary + PT labels used in
    # the dashboard). Extend this as you add more fields.
    market_aliases:
      prob_home_win: "1x2.home"
      prob_draw: "1x2.draw"
      prob_away_win: "1x2.away"
      prob_btts_yes: "btts.yes"
      prob_btts_no: "btts.no"
      prob_over_2_5: "over_under_2.5.over"
      prob_under_2_5: "over_under_2.5.under"

betclic:
  base_url: "https://www.betclic.pt"
  request_delay_seconds: 2.0   # be polite -- one request every N seconds

  fixtures:
    # CALIBRATED (2026-09-11): betclic.pt is an Angular app that embeds its
    # data as JSON in a `<script>` tag (Angular TransferState / hydration
    # cache -- keys look like "grpc:<hash>"). One of those keys holds
    # {"response": {"payload": {"matches": [...]}}} -- the JMESPath below
    # finds it under *whatever* hash key it lands on, so it survives the
    # hash changing between requests.
    #
    # STILL TO DO: the page's default view (and what our one inspection
    # captured) is the "Em Direto" (live) tab -- these matches all had
    # isLive: true. To get *upcoming* (not yet kicked off) games too, open
    # a specific competition page (e.g. click "Liga Portugal Betclic" on
    # the site) and re-run scripts/inspect_site.py on that URL -- same
    # "matches" JSON shape is expected (isLive: false, no scoreboard), so
    # the fields below should keep working unchanged; you may just need a
    # second `fixtures.url` per competition/day, or to confirm one URL
    # already lists the whole day.
    url: "https://www.betclic.pt/futebol-sfootball"
    json_list_path: "*.response.payload.matches[]"

    fields:
      - key: league
        json_path: "competition.name"
      - key: home_team
        json_path: "contestants[0].name"
      - key: away_team
        json_path: "contestants[1].name"
      - key: kickoff
        json_path: "matchDateUtc"
      # 1X2 ("Resultado (Tempo Regulamentar)") comes inline in the same
      # match object, as market.mainSelections in [home, draw, away]
      # order -- confirmed against real data, no detail-page hop needed
      # for this market.
      - key: odd_home
        json_path: "market.mainSelections[0].odds"
      - key: odd_draw
        json_path: "market.mainSelections[1].odds"
      - key: odd_away
        json_path: "market.mainSelections[2].odds"

    market_aliases:
      odd_home: "1x2.home"
      odd_draw: "1x2.draw"
      odd_away: "1x2.away"

  odds:
    # NOT YET CALIBRATED: BTTS / over-under / correct score odds don't
    # appear in the listing payload above -- they likely need a visit to
    # the match's own page. We don't yet have a reliable `match_url` (the
    # listing JSON doesn't include one, and Betclic's URL pattern is
    # /{sport}-s{sportId}/{competition}-c{competitionId}/{match}-m{matchId}
    # with a slugified name whose exact slugification rules are unconfirmed).
    # To calibrate: open one match manually on betclic.pt, copy its real
    # URL, and run scripts/inspect_site.py on it -- likely the same
    # "matches[0].market"-shaped JSON, just with more markets/selections,
    # or a list of markets per match. Until then, the pipeline runs on the
    # 1X2 market alone (matches xgscore's 1X2 probabilities), which is
    # already enough for the value-bet ranking on that market.
    fields: []
    market_aliases: {}
