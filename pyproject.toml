[project]
name = "tipsxgs"
version = "0.1.0"
description = "Daily xGScore fixtures/predictions + Betclic odds -> value bet dashboard"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "click>=8.1",
    "python-dateutil>=2.9",
    "jmespath>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tipsxgs = ["templates/*.j2"]
